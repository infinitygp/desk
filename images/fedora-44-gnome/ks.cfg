# Fedora 44 Workstation (GNOME, Wayland) golden image for the desk harness.
# @SSH_PUBKEY@ is replaced by `desk image build`.
text
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Europe/Warsaw --utc
network --bootproto=dhcp --device=link --activate --hostname=desk-fedora
url --url=https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/
repo --name=updates --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=btrfs
bootloader --timeout=1

rootpw --lock
user --name=tester --password=tester --plaintext --groups=wheel --gecos="Tester"
sshkey --username=tester "@SSH_PUBKEY@"

selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,qemu-guest-agent
firstboot --disable
# A text-mode install would otherwise leave multi-user.target as the default.
xconfig --startxonboot
poweroff

%packages
@^workstation-product-environment
qemu-guest-agent
openssh-server
python3-pyatspi
policycoreutils-python-utils
-gnome-initial-setup
-gnome-tour
%end

%post --erroronfail
# Log straight into the graphical session: the harness drives a real GNOME session.
cat > /etc/gdm/custom.conf <<'EOF'
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=tester
EOF

# Keep the screen stable for screenshots: no lock, no blanking, no animations,
# no first-run dialogs, accessibility bus always on for the a11y tree.
mkdir -p /etc/dconf/db/local.d /etc/dconf/profile
[ -f /etc/dconf/profile/user ] || printf 'user-db:user\nsystem-db:local\n' > /etc/dconf/profile/user
grep -q '^system-db:local$' /etc/dconf/profile/user || echo 'system-db:local' >> /etc/dconf/profile/user
cat > /etc/dconf/db/local.d/00-desk <<'EOF'
[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/screensaver]
lock-enabled=false
idle-activation-enabled=false

[org/gnome/desktop/lockdown]
disable-lock-screen=true

[org/gnome/desktop/interface]
enable-animations=false
toolkit-accessibility=true

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'
idle-dim=false

[org/gnome/software]
download-updates=false

[org/gnome/shell]
welcome-dialog-last-shown-version='999'
EOF
dconf update

echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/90-tester
chmod 0440 /etc/sudoers.d/90-tester

# Commands run through qemu-guest-agent are confined to virt_qemu_ga_t; only binaries
# labelled virt_qemu_ga_unconfined_exec_t may leave it, so `desk exec --agent` goes
# through this wrapper.
mkdir -p /usr/local/libexec
cat > /usr/local/libexec/desk-ga-run <<'EOF2'
#!/bin/bash
export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
exec "$@"
EOF2
chmod 0755 /usr/local/libexec/desk-ga-run
semanage fcontext -a -t virt_qemu_ga_unconfined_exec_t /usr/local/libexec/desk-ga-run
restorecon -v /usr/local/libexec/desk-ga-run
setsebool -P virt_qemu_ga_run_unconfined on
%end
