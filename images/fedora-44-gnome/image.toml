# libosinfo on this host has no fedora44 entry yet; fedora43 gives the same device defaults.
os_variant = "fedora43"
memory_mib = 4096
vcpus = 4
disk_gb = 40
location = "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/"
kickstart = "ks.cfg"
user = "tester"
provision = "provision.sh"
files = ["../_shared/gnome"]
# Run over SSH as `user`; the desktop counts as ready once this succeeds and the screen settles.
ready = "systemctl --user is-active --quiet graphical-session.target"
# Prefix for `desk exec --agent`; see the wrapper in ks.cfg.
agent_wrapper = ["/usr/local/libexec/desk-ga-run"]
# Run as root after provision.sh so the session picks up the shell extension (Wayland cannot restart the shell in place).
relogin = "systemctl restart gdm"
# Guest keyboard layout set by provision.sh; `desk type` maps characters to keys for it.
layout = "pl"
