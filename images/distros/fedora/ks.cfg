# Fedora for the desk harness: the system without a desktop, which the desktop block's install
# script adds over SSH before the build becomes the base image.
# @SSH_PUBKEY@ and @RELEASE@ are replaced by `desk image build`.
text
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
# UTC until provisioning sets the zone desk was given (DESK_TIMEZONE).
timezone Etc/UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=desk-fedora
# Packages from the mirrors of the release (@RELEASE@ from block.toml), so a pre-release image
# picks up the final packages by itself; only the installer's own tree (location) is fixed.
url --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-@RELEASE@&arch=x86_64
# Not named "updates": anaconda turns the installer's own repository of that name off and, given a
# repo of the same name, only points it elsewhere, so the install took the release's packages.
repo --name=desk-updates --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f@RELEASE@&arch=x86_64

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=btrfs
bootloader --timeout=1

rootpw --lock
user --name=tester --password=tester --plaintext --groups=wheel --gecos="Tester"
sshkey --username=tester "@SSH_PUBKEY@"
# The harness does root work over its own key, so tester keeps a normal password sudo and
# Cockpit, polkit and sudo prompts look as they do for a real user.
sshkey --username=root "@SSH_PUBKEY@"

selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,qemu-guest-agent
firstboot --disable
poweroff

%packages
@core
qemu-guest-agent
openssh-server
# The a11y helper: AT-SPI through GObject introspection.
python3-pyatspi
# The browser every desktop image has, next to the desktop's own (desk browser --browser chromium).
chromium
policycoreutils-python-utils
%end

%post --erroronfail
# Commands run through qemu-guest-agent are confined to virt_qemu_ga_t; only binaries
# labelled virt_qemu_ga_unconfined_exec_t may leave it, so `desk exec --agent` goes
# through this wrapper.
mkdir -p /usr/local/libexec
cat > /usr/local/libexec/desk-ga-run <<'EOF2'
#!/bin/bash
export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
exec "$@"
EOF2
chmod 0755 /usr/local/libexec/desk-ga-run
semanage fcontext -a -t virt_qemu_ga_unconfined_exec_t /usr/local/libexec/desk-ga-run
restorecon -v /usr/local/libexec/desk-ga-run
setsebool -P virt_qemu_ga_run_unconfined on
%end
