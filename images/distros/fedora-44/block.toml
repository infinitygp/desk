# Fedora 44, installed over the network with a kickstart.
# fedora43, as an older libosinfo has no fedora44 entry; it gives the same device defaults.
os_variant = "fedora43"
memory_mib = 4096
vcpus = 4
disk_gb = 40
location = "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/"
kickstart = "ks.cfg"
release = "44"
user = "tester"
# Prefix for `desk exec --agent`; see the wrapper in ks.cfg.
agent_wrapper = ["/usr/local/libexec/desk-ga-run"]
# `desk maintain` reinstalls it this often, so tests run against current updates.
rebuild_days = 28
desktops = ["gnome", "kde", "xfce", "cinnamon"]
