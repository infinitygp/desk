# Debian 13 (trixie): the official cloud image; cloud-init makes the users, install.sh the rest.
installer = "cloudimg"
os_variant = "debian13"
memory_mib = 4096
vcpus = 4
disk_gb = 40
# The generic image: the genericcloud one's kernel has no drivers for a display. Rebuilt
# with every point release and security update; `desk image build` takes the latest.
cloud_image_url = "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
cloud_image_sums = "SHA512SUMS"
user_data = "user-data"
# Over SSH once cloud-init has powered off: the system under any desktop.
install = ["install.sh"]
user = "tester"
# `desk maintain` reinstalls it this often, so tests run against current updates.
rebuild_days = 28
desktops = ["gnome", "kde", "xfce", "cinnamon", "hyprland"]
