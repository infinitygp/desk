# Windows 11 Enterprise evaluation (26H2, 90 days; `desk maintain` reinstalls it before it runs out).
installer = "windows"
os_variant = "win11"
memory_mib = 6144
vcpus = 4
disk_gb = 64
iso = "win11-26h2-enterprise-eval.iso"
iso_url = "https://go.microsoft.com/fwlink/?LinkId=2382600&clcid=0x409&culture=en-us&country=us"
iso_sha256 = "bc3f24086ebadc94489066b5ad78089e2cf5c3491e90e790bb81a2b199c10e38"
unattend = "autounattend.xml"
# Copied to the answer-file CD next to autounattend.xml; firstboot.ps1 runs at the first logon.
unattend_files = ["firstboot.ps1", "agent"]
# firstboot.ps1 ends with this line on the serial console, or with what failed.
install_marker = "desk-firstboot: ok"
virtio_win_iso = "virtio-win-0.1.302.iso"
virtio_win_url = "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.302-1/virtio-win-0.1.302.iso"
virtio_win_sha256 = "303f7ae40dad495d6ae474fdc571df58958a4dbc5c37a522d80f9a203867949d"
openssh_msi = "OpenSSH-Win64-v10.0.0.0.msi"
openssh_msi_url = "https://github.com/PowerShell/Win32-OpenSSH/releases/download/10.0.0.0p2-Preview/OpenSSH-Win64-v10.0.0.0.msi"
openssh_msi_sha256 = "ddec9c53864280759cf9f74791cefd387100e3946aa849a1c138a4ed1b96b7d9"
user = "tester"
family = "windows"
desktop = "windows"
root_user = "tester"
# In-session agent (agent/agent.ps1), forwarded from the host like SSH.
agent_port = 47011
ready = "try { (New-Object Net.Sockets.TcpClient).Connect('127.0.0.1', 47011); exit 0 } catch { exit 1 }"
sync = "Write-VolumeCache -DriveLetter C"
reboot = "shutdown.exe /r /t 0 /f"
# A full shutdown: without /hybrid, the next boot does not resume a hibernated kernel.
poweroff = "shutdown.exe /s /t 0 /f"
boot_id = "(Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToFileTimeUtc()"
provision = "provision.ps1"
# Windows has no way to restart just the desktop session from SSH; a reboot logs in again.
relogin = "shutdown.exe /r /t 0 /f"
# Refreshed in C:\desk at every warm-up, so agent fixes do not need a new install.
files = ["agent"]
# `desk selftest` watches the guest for this long after its start and fails when it works in the background;
# a start of the image is handed over once the guest is calm.
calm_seconds = 180
# Before the warm state is saved: wait until Windows' boot work is over, so a restored run does not inherit it:
# 2 minutes in a row of 15 s averages under 5 % CPU (its delayed work came after shorter lulls), not counting
# interrupts: the timer interrupts of a nested guest alone can exceed that. Not before the guest has been up for
# 11 minutes: the Widgets feed loads about 6 minutes after a boot and a group of tasks starts 10 minutes after
# the logon, and a state saved in a lull before them had every run load the feed in its first minutes. After
# 900 s (by the clock) it names what was still busy and fails, since every run would replay that work. Then
# empty the standby list: the file cache Windows keeps in free memory would be saved with it, about half of the
# memory state and of the time a restore takes.
idle = '''
$sw = [Diagnostics.Stopwatch]::StartNew(); $calm = 0
$cpu = New-Object Diagnostics.PerformanceCounter 'Processor', '% Processor Time', '_Total'
$irq = New-Object Diagnostics.PerformanceCounter 'Processor', '% Interrupt Time', '_Total'
[void]$cpu.NextValue(); [void]$irq.NextValue()
while ($calm -lt 8) {
    if ($sw.Elapsed.TotalSeconds -gt 860) {
        $before = @{}; Get-Process | ForEach-Object { $before[$_.Id] = $_.TotalProcessorTime.TotalSeconds }
        Start-Sleep 10
        $svc = @{}; Get-CimInstance Win32_Service -Filter 'ProcessId > 0' | ForEach-Object { $svc[[int]$_.ProcessId] += @($_.Name) }
        $busy = Get-Process | Where-Object { $before.ContainsKey($_.Id) } | ForEach-Object {
            $name = if ($_.ProcessName -eq 'svchost' -and $svc[$_.Id]) { $svc[$_.Id] -join '+' } else { $_.ProcessName }
            [pscustomobject]@{ Name = $name; Seconds = $_.TotalProcessorTime.TotalSeconds - $before[$_.Id] }
        } | Sort-Object Seconds -Descending | Select-Object -First 4 | ForEach-Object { '{0} {1:n1} s' -f $_.Name, $_.Seconds }
        $tasks = @(Get-ScheduledTask | Where-Object State -eq Running | ForEach-Object { $_.TaskPath + $_.TaskName })
        [Console]::Error.WriteLine("Windows still busy after 900 s ($([int]$load) % CPU): in 10 s $($busy -join ', '); " +
            "tasks running: $(if ($tasks) { $tasks -join ', ' } else { 'none' })")
        exit 1
    }
    Start-Sleep 15
    $load = $cpu.NextValue() - $irq.NextValue()
    if ($load -lt 5 -and [Environment]::TickCount -ge 660000) { $calm++ } else { $calm = 0 }
}
Add-Type -Namespace Desk -Name Memory -MemberDefinition '[DllImport("ntdll.dll")] public static extern int RtlAdjustPrivilege(int privilege, bool enable, bool thread, out bool was); [DllImport("ntdll.dll")] public static extern int NtSetSystemInformation(int infoClass, ref int command, int length);'
# SeProfileSingleProcessPrivilege (13), then SystemMemoryListInformation (80) with MemoryPurgeStandbyList (4).
$was = $false; [void][Desk.Memory]::RtlAdjustPrivilege(13, $true, $false, [ref]$was)
$purge = 4; exit [Desk.Memory]::NtSetSystemInformation(80, [ref]$purge, 4)
'''
# Windows has no audio device in this VM otherwise; apps need one (volume, media sessions).
sound = "ich9"
# Minutes left of the evaluation licence.
expiry = "(Get-CimInstance SoftwareLicensingProduct | Where-Object { $_.PartialProductKey -and $_.Name -like 'Windows*' }).GracePeriodRemaining"
