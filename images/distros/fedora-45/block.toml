# Fedora 45, installed over the network with a kickstart (fedora-44's, with this release).
# libosinfo on this host has no fedora45 entry yet; fedora43 gives the same device defaults.
os_variant = "fedora43"
memory_mib = 4096
vcpus = 4
disk_gb = 40
location = "https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Everything/x86_64/os/"
kickstart = "../fedora-44/ks.cfg"
release = "45"
user = "tester"
agent_wrapper = ["/usr/local/libexec/desk-ga-run"]
# `desk maintain` reinstalls it this often, so tests run against current updates.
rebuild_days = 14
desktops = ["gnome"]
