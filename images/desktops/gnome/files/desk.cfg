// desk (images/desktops/gnome/files/desk.cfg, Firefox's autoconfig; its first line is skipped)
// What an uncaught exception or rejected promise of a page carried, written to Firefox's output
// after its "JavaScript error:" line as "JavaScript error detail: {JSON}", so that desk browser
// console and the report can show the thrown object ("uncaught exception: Object") and where it
// came from. Runs in every content process, where the error still holds the thrown value. Nothing
// here may stop Firefox from starting, hence the try blocks.
try {
  Services.ppmm.loadProcessScript("data:,(" + encodeURIComponent(String(function () {
    const Ci = Components.interfaces;
    Components.classes["@mozilla.org/consoleservice;1"].getService(Ci.nsIConsoleService).registerListener({
      observe(msg) {
        try {
          if (!(msg instanceof Ci.nsIScriptError) || !msg.hasException)
            return;
          let value = null;
          try {
            value = JSON.stringify(Components.utils.waiveXrays(msg.exception));
          } catch (e) {
            value = null;
          }
          const stack = [];
          for (let f = msg.stack; f && stack.length < 6; f = f.parent || f.asyncParent)
            stack.push(`${f.functionDisplayName || "(anonymous)"}@${f.source}:${f.line}:${f.column}`);
          dump("JavaScript error detail: " + JSON.stringify({
            message: msg.errorMessage,
            value: value && value !== "{}" ? value.slice(0, 400) : null,
            stack,
          }) + "\n");
        } catch (e) {
          // A message that cannot be described stays as Firefox printed it.
        }
      },
    });
  })) + ")()", true);
} catch (e) {
  dump(`desk.cfg: ${e}\n`);
}
