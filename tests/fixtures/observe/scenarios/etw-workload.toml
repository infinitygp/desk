# A logman session of Microsoft-Windows-Kernel-Process (process keyword 0x10) sees the
# workload's child processes, and desk's marker provider records the marks; tracerpt turns the
# trace into CSV. Afterwards: expect.py MANIFEST --tracerpt-csv REPORT/observe/s1/events.csv
image = "windows-11"
[build]
artifacts = ["tests/fixtures/observe/workload.ps1"]
[[observe]]
provider = "etw"
label = "kp"
duration = 600
max_mb = 256
options = {providers = ["Microsoft-Windows-Kernel-Process:0x10:4"], tracerpt = true}
[[step]]
mark = "workload starts"
[[step]]
exec = "powershell -NoProfile -ExecutionPolicy Bypass -File C:/Users/tester/desk/workload.ps1 -Token etw1 -Steps process"
output = "workload etw1 done"
timeout = 300
[[step]]
mark = "workload done"
[[step]]
observe_stop = "kp"
