name: Observe on Windows

# The guest side of desk observe on a Windows runner: Windows PowerShell 5.1 parses the scripts
# desk runs in guests, and scripts/observe_windows_ci.py runs the helper's operations and the
# providers' command lines (logman, WPR, pktmon, netsh, tracerpt) for real, without a VM. Not a
# desk run, not Windows 11 and neither ProcMon nor USBPcap: docs/observe/validation.md, CI-*.
# Only when asked: run by hand (workflow_dispatch, once the workflow is on the default branch), or
# a push whose last commit message says [windows-ci]. Other pushes skip the job, which uses no
# runner minutes.
on:
  push:
    paths:
      - "desk/observe/**"
      - "docs/observe/fixtures/**"
      - "scripts/observe_windows_ci.py"
      - ".github/workflows/observe-windows.yml"
  workflow_dispatch:

# One run per branch: a newer push cancels the run of the one before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-ci]')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Windows PowerShell 5.1 parses the guest scripts
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          $bad = 0
          foreach ($f in 'desk/observe/helper.ps1', 'docs/observe/fixtures/workload.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { "${f}:$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Helper and providers
        run: python scripts/observe_windows_ci.py --out observe-ci.json

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observe-ci
          path: observe-ci.json
